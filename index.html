<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0705">
<meta name="description" content="Restaurant Taj Assil : cuisine syrienne authentique & saveurs du Levant. Retrouvez nos r&eacute;seaux : Instagram, Facebook, TikTok, WhatsApp et Google Maps.">
<title>Restaurant Taj Assil | Cuisine Syrienne Authentique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
:root {
  --ink: #070503;
  --gold: #e2b765;
  --gold2: #b88a38;
  --goldhi: #fae4ab;
  --goldbright: #ffe8ab;
  --ivory: #faf4e8;
  --mute: #c4b49a;
  --head: "Cormorant Garamond", "Cinzel", Georgia, serif;
  --body: "Plus Jakarta Sans", "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --goldline: linear-gradient(135deg, #fae4ab 0%, #b88a38 42%, #e2b765 72%, #8c6820 100%);
  --goldline-soft: linear-gradient(135deg, rgba(250,228,171,0.65) 0%, rgba(184,138,56,0.3) 45%, rgba(226,183,101,0.65) 75%, rgba(140,104,32,0.2) 100%);
  --card-bg: linear-gradient(175deg, rgba(16, 10, 6, 0.28) 0%, rgba(10, 6, 3, 0.38) 100%);
  --link-bg: linear-gradient(135deg, rgba(28, 18, 11, 0.32) 0%, rgba(14, 8, 4, 0.44) 100%);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--ink);
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  font: 400 15px/1.5 var(--body);
  color: var(--ivory);
  overflow-x: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(12px, 2.5vh, 24px) clamp(12px, 3vw, 20px);
}

/* Background Scene with cinematic backdrop */
.scene {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--ink);
  overflow: hidden;
  pointer-events: none;
}

.scene::before {
  content: "";
  position: absolute;
  inset: -15px;
  background: url("bg.jpg") center center / cover no-repeat;
  filter: brightness(0.96) contrast(1.05) saturate(1.1);
  transform: scale(1.02);
  will-change: transform;
}

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse 100% 100% at 50% 35%, transparent 25%, rgba(6, 4, 2, 0.35) 75%, rgba(6, 4, 2, 0.65) 100%),
    linear-gradient(180deg, rgba(6, 4, 2, 0.25) 0%, transparent 20%, transparent 75%, rgba(6, 4, 2, 0.55) 100%);
  pointer-events: none;
}

@media (min-width: 768px) {
  .scene::before {
    background-position: center 35%;
  }
}

/* Main Luxury Card Shell */
.card-shell {
  width: 100%;
  max-width: 460px;
  margin: auto;
  border-radius: 32px;
  padding: clamp(22px, 3.8vh, 34px) clamp(18px, 5vw, 28px);
  background: var(--card-bg) padding-box, var(--goldline-soft) border-box;
  border: 1.5px solid transparent;
  box-shadow: 
    0 24px 60px -15px rgba(0, 0, 0, 0.8),
    0 0 45px -8px rgba(226, 183, 101, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
  backdrop-filter: blur(10px) saturate(140%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 2.5vh, 22px);
  animation: cardFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* Status Badge */
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid rgba(226, 183, 101, 0.3);
  background: rgba(22, 14, 9, 0.6);
  font: 500 12px/1 var(--body);
  color: var(--goldhi);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
  animation: pulseDot 2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* Header & Crest */
.crest-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
}

.crest-pic {
  display: block;
}

.crest-img {
  display: block;
  width: clamp(105px, 24vw, 130px);
  height: auto;
  margin: 0 auto;
  filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 24px rgba(226, 183, 101, 0.35));
  animation: crestFloat 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.brand-text {
  margin-top: 6px;
  text-align: center;
}

.brand-title {
  font: 700 clamp(23px, 6vw, 30px)/1.1 var(--head);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding-left: 0.22em;
  background: linear-gradient(135deg, #ffffff 0%, #fae4ab 30%, #d8a649 65%, #fae4ab 85%, #b38228 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8));
}

.brand-tag {
  margin-top: 5px;
  font: 600 clamp(11.5px, 3.2vw, 13.5px)/1.3 var(--head);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  padding-left: 0.22em;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
}

/* Arabesque filigree rule */
.arabesque-rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 10px auto 0;
  width: min(80%, 240px);
  color: var(--gold);
}

.arabesque-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold2));
}

.arabesque-line:last-child {
  transform: scaleX(-1);
}

.arabesque-diamond {
  font-size: 11px;
  color: var(--goldhi);
  text-shadow: 0 0 8px rgba(226, 183, 101, 0.8);
}

/* Links Navigation */
.links-nav {
  width: 100%;
}

.links {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: clamp(9px, 1.6vh, 13px);
  width: 100%;
}

.link-item {
  width: 100%;
  animation: itemRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.link-item:nth-child(1) { animation-delay: 0.15s; }
.link-item:nth-child(2) { animation-delay: 0.25s; }
.link-item:nth-child(3) { animation-delay: 0.35s; }
.link-item:nth-child(4) { animation-delay: 0.45s; }
.link-item:nth-child(5) { animation-delay: 0.55s; }

.link {
  --x: 50%;
  --y: 50%;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: 46px 1fr 24px;
  align-items: center;
  gap: 13px;
  min-height: clamp(56px, 7.4vh, 64px);
  padding: 7px 18px 7px 9px;
  border-radius: 999px;
  background: var(--link-bg) padding-box, var(--goldline-soft) border-box;
  border: 1.5px solid transparent;
  color: inherit;
  text-decoration: none;
  overflow: hidden;
  box-shadow: 
    0 8px 22px -6px rgba(0, 0, 0, 0.65),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, background 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}

/* Interactive touch / hover radial spotlight */
.link::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: 0;
  background: radial-gradient(180px circle at var(--x) var(--y), rgba(226, 183, 101, 0.35), transparent 70%);
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.link:hover, .link:active {
  transform: translateY(-2px) scale(1.012);
  box-shadow: 
    0 12px 28px -6px rgba(226, 183, 101, 0.42),
    0 0 22px -4px rgba(226, 183, 101, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  background: linear-gradient(135deg, rgba(42, 26, 16, 0.5) 0%, rgba(20, 12, 6, 0.6) 100%) padding-box, var(--goldline) border-box;
}

.link:hover::before, .link:active::before {
  opacity: 1;
}

.link:active {
  transform: scale(0.985);
}

.link:focus-visible {
  outline: 2px solid var(--goldbright);
  outline-offset: 3px;
}

/* Icon Medallion */
.ico {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--gold);
  background: radial-gradient(circle at 35% 30%, rgba(226, 183, 101, 0.4) 0%, rgba(16, 10, 6, 0.65) 100%);
  color: var(--goldbright);
  box-shadow: 
    inset 0 1px 2px rgba(255, 255, 255, 0.3),
    0 4px 10px rgba(0, 0, 0, 0.5);
  flex-shrink: 0;
}

.ico svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Text Hierarchy */
.txt-group {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.t {
  display: block;
  font: 600 clamp(16.5px, 2.5vh, 19.5px)/1.2 var(--head);
  color: #fffcf5;
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 1);
}

.s {
  display: block;
  margin-top: 2px;
  font-size: clamp(11.5px, 1.7vh, 13px);
  color: #fae6cb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
}

/* Chevron arrow */
.action-arrow {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--gold);
  transition: transform 0.25s ease, color 0.25s ease;
}

.action-arrow svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.link:hover .action-arrow {
  transform: translateX(4px);
  color: var(--goldbright);
}

/* Footer */
.footer {
  text-align: center;
  color: var(--gold);
  width: 100%;
  margin-top: 4px;
}

.footer-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 6px;
  color: var(--gold2);
  opacity: 0.8;
}

.footer-ornament span {
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold2));
}

.footer-ornament span:last-child {
  transform: scaleX(-1);
}

.footer-ornament svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

.footer-text {
  font: 500 clamp(10px, 2.6vw, 11.5px)/1.4 var(--body);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

/* Animations */
@keyframes cardFadeIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes crestFloat {
  from {
    opacity: 0;
    transform: translateY(-10px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes itemRise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* Mobile Enhanced Transparency & Focal Framing */
@media (max-width: 640px) {
  :root {
    --card-bg: linear-gradient(175deg, rgba(16, 10, 6, 0.2) 0%, rgba(10, 6, 3, 0.28) 100%);
    --link-bg: linear-gradient(135deg, rgba(28, 18, 11, 0.22) 0%, rgba(14, 8, 4, 0.32) 100%);
  }

  body {
    padding: clamp(10px, 2vh, 18px) clamp(10px, 3.5vw, 16px);
  }

  .scene::before {
    background-position: 42% 25%;
    filter: brightness(0.98) contrast(1.05) saturate(1.12);
  }

  .scene::after {
    background: 
      radial-gradient(ellipse 120% 100% at 50% 30%, transparent 20%, rgba(6, 4, 2, 0.2) 70%, rgba(6, 4, 2, 0.45) 100%),
      linear-gradient(180deg, rgba(6, 4, 2, 0.15) 0%, transparent 15%, transparent 80%, rgba(6, 4, 2, 0.4) 100%);
  }

  .card-shell {
    max-width: 100%;
    border-radius: 26px;
    padding: clamp(16px, 2.5vh, 24px) clamp(14px, 4vw, 20px);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    backdrop-filter: blur(6px) saturate(160%);
    box-shadow: 
      0 16px 45px -10px rgba(0, 0, 0, 0.65),
      0 0 35px -5px rgba(226, 183, 101, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    gap: clamp(12px, 2vh, 18px);
  }

  .crest-img {
    width: clamp(90px, 22vw, 115px);
  }

  .brand-title {
    font-size: clamp(21px, 5.6vw, 26px);
  }

  .link {
    min-height: 54px;
    padding: 6px 14px 6px 8px;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }

  .ico {
    width: 40px;
    height: 40px;
  }

  .ico svg {
    width: 20px;
    height: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<script>
(() => {
  'use strict';
  const ALLOWED = new Set(['https:', 'tel:', 'mailto:']);
  document.querySelectorAll('a[href]').forEach((a) => {
    let u;
    try { u = new URL(a.getAttribute('href'), location.href); } catch (e) { a.removeAttribute('href'); return; }
    if (!ALLOWED.has(u.protocol)) { a.removeAttribute('href'); return; }
    if (u.protocol === 'https:') { a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; }
  });

  // Dynamic interactive radial glow following cursor / touch position
  const updateGlow = (el, e) => {
    const rect = el.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX) || 0) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY) || 0) - rect.top;
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
  };

  document.querySelectorAll('.link').forEach((el) => {
    ['pointermove', 'pointerdown', 'touchmove'].forEach((evt) => {
      el.addEventListener(evt, (e) => updateGlow(el, e), { passive: true });
    });
  });
})();
</script>
